:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08090e;color:#e8e0d0;font-family:Georgia,serif}main{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:8px}#frame{width:min(100%,1100px);position:relative;border:1px solid #51443c;box-shadow:0 0 55px #000;overflow:hidden;background:#0b0d16}canvas{display:block;width:100%;height:auto;aspect-ratio:16/9}#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,12,.86);padding:18px;overflow:auto}#overlay.hidden{display:none}.panel{width:min(560px,100%);max-height:100%;overflow:auto;text-align:center;border:1px solid #806345;background:linear-gradient(145deg,#171720,#090b12);padding:clamp(16px,4vw,34px);box-shadow:0 0 45px #000}h1{font-size:clamp(25px,5vw,43px);letter-spacing:3px;color:#d8b47a;margin:0 0 8px}h2{color:#d8b47a;letter-spacing:2px;font-size:18px}p{line-height:1.5;color:#d0c9bd;margin:10px 0}button{font:inherit;color:#f0dfc0;background:#282019;border:1px solid #a27a49;padding:11px 15px;margin:4px;cursor:pointer;transition:.15s;max-width:100%}button:hover{background:#604128;transform:translateY(-1px)}.small{font-size:12px;color:#9e9aa1}#footer{width:min(100%,1100px);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;color:#9e9aa1;font:12px Arial,sans-serif}kbd{border:1px solid #82715b;border-radius:3px;padding:2px 5px;color:#e8d6b4;white-space:nowrap}#buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:3px}.panel::-webkit-scrollbar{width:7px}.panel::-webkit-scrollbar-thumb{background:#51443c}@media(max-width:600px){main{padding:0}#frame{width:100%;border-left:0;border-right:0}#footer{font-size:10px;padding:8px}.panel{padding:14px}button{padding:9px 10px;font-size:13px}#overlay{padding:8px}}

:root{--gold:#dfbd80;--ember:#ef805e;--violet:#a78bfa;--ice:#9de3f4}

<body>
<main>
<div id="frame">
<canvas id="game" width="960" height="540" aria-label="Blade of the Fallen oyun alanı"></canvas>
<div id="overlay"><div class="panel" id="panel"></div></div>
<button id="quickShop" type="button" aria-label="Kül Taciri dükkânını aç">⚒ DÜKKÂN <span style="opacity:.7">[B]</span></button>
<div id="touchControls" aria-label="Telefon ve tablet oyun kontrolleri">
  <div class="touch-cluster move-cluster">
    <button type="button" data-hold="a" aria-label="Sola yürü">◀</button>
    <button type="button" data-action="jump" aria-label="Zıpla">⬆ Zıpla</button>
    <button type="button" data-hold="d" aria-label="Sağa yürü">▶</button>
  </div>
  <div class="touch-cluster combat-cluster">
    <button type="button" class="touch-attack" data-action="light">⚔ Hızlı</button>
    <button type="button" class="touch-heavy" data-action="heavy">💥 Ağır</button>
    <button type="button" data-action="parry">🛡 Savuştur</button>
    <button type="button" data-action="dodge">↗ Kaçın</button>
    <button type="button" class="touch-interact" data-action="interact" aria-label="Yakındaki karakter, sunak veya dinlenme noktasıyla etkileşime geç">✋ ETKİLEŞİM</button>
    <button type="button" data-action="shop">🛒 Dükkân</button>
  </div>
  <div class="touch-cluster utility-cluster">
    <button type="button" data-action="inventory">🎒 Çanta</button>
    <button type="button" data-action="journal">📜 Görev</button>
    <button type="button" data-action="map">🗺 Harita</button>
    <button type="button" data-action="shadow">🌑 Gölge</button>
  </div>
</div>
</div>
<div id="footer"><span>BLADE OF THE FALLEN · RPG EDITION</span><span id="footerControls"><kbd>A</kbd><kbd>D</kbd> Hareket · <kbd>W</kbd>/<kbd>Space</kbd> Zıpla · <kbd>J</kbd> Hızlı Kes · <kbd>K</kbd> Ağır Kes · <kbd>L</kbd> Savuştur · <kbd>Shift</kbd> Kaçın · <kbd>E</kbd> Etkileşim · <kbd>B</kbd> Dükkân</span></div>
</main>
<script>
"use strict";
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
const W = canvas.width, H = canvas.height, GROUND = 470;
let WORLD = 3500;
const keys = new Set(), pressed = new Set(), platforms = [];
let mode = "menu", lastTime = 0, player = null, enemies = [], boss = null, particles = [], camera = {x:0}, shake = 0;
let gameTime = 0, banner = "", bannerTimer = 0, audioCtx = null, soundOn = true, bossUnlocked = false, bossNotice = false, kills = 0, damageFlash = 0;
let touchModeEnabled = false;
try { touchModeEnabled = localStorage.getItem("blade-of-the-fallen-touch") === "1"; } catch (_) {}
const gameFrame = document.getElementById("frame");
const touchControls = document.getElementById("touchControls");
const quickShopButton = document.getElementById("quickShop");
const footerControls = document.getElementById("footerControls");
function syncPlayControls(){
  if(gameFrame) gameFrame.classList.toggle("touch-enabled", touchModeEnabled);
  const playingVisible = mode === "playing" && overlay.classList.contains("hidden");
  if(touchControls) touchControls.style.display = touchModeEnabled && playingVisible ? "flex" : "none";
  if(quickShopButton) quickShopButton.style.display = playingVisible ? "block" : "none";
  if(footerControls) footerControls.innerHTML = touchModeEnabled
    ? "DOKUNMATİK: YÖN · ZIPLA · HIZLI/AĞIR SALDIRI · SAVUŞTUR · KAÇIN · ETKİLEŞİM · DÜKKÂN · ÇANTA · GÖREV · HARİTA"
    : "<kbd>A</kbd><kbd>D</kbd> Hareket · <kbd>W</kbd>/<kbd>Space</kbd> Zıpla · <kbd>J</kbd> Hızlı Kes · <kbd>K</kbd> Ağır Kes · <kbd>L</kbd> Savuştur · <kbd>Shift</kbd> Kaçın · <kbd>E</kbd> Etkileşim · <kbd>B</kbd> Dükkân · <kbd>I</kbd> Çanta · <kbd>Q</kbd> Görev · <kbd>M</kbd> Harita · <kbd>X</kbd> Gölge";
}
function setTouchMode(enabled){
  touchModeEnabled = Boolean(enabled);
  try { localStorage.setItem("blade-of-the-fallen-touch", touchModeEnabled ? "1" : "0"); } catch (_) {}
  syncPlayControls();
}
const clamp = (v,a,b) => Math.max(a, Math.min(b,v));
const rand = (a,b) => a + Math.random() * (b-a);
const rects = (a,b) => a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;

function sound(freq=180, duration=.07, type="sawtooth", volume=.035) {
  if (!soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,audioCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.48),audioCtx.currentTime+duration);
    g.gain.setValueAtTime(volume,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+duration);
  } catch (_) {}
}
function showPanel(title, body, buttons=[]) {
  panel.classList.remove("shop-panel");
  overlay.classList.remove("hidden");
  panel.innerHTML = `<h1>${title}</h1>${body}<div id="buttons"></div>`;
  const box=panel.querySelector("#buttons");
  for (const b of buttons) {
    const el=document.createElement("button"); el.textContent=b.label; el.addEventListener("click",b.action); box.appendChild(el);
  }
  syncPlayControls();
}
function hidePanel(){overlay.classList.add("hidden");syncPlayControls();}
function bannerText(text,seconds=2.5){banner=text;bannerTimer=seconds;}
function makePlayer(){
  return {x:100,y:GROUND-58,w:34,h:58,vx:0,vy:0,hp:100,maxHp:100,stamina:100,maxStamina:100,ashes:0,level:1,stats:{strength:5,dexterity:5,vigor:5},face:1,grounded:false,state:"idle",stateTimer:0,attack:null,attackSerial:0,dodge:0,dodgeCd:0,parry:0,parryCd:0,stun:0,invuln:0,combo:0,comboTimer:0,anim:0,exhaustedTimer:0,staminaRegenDelay:0,jumpCount:0,wallSide:0,wallJumpTimer:0,wallJumpDir:0,shadowDashTimer:0};
}
function makeEnemy(x,type="soldier"){
  const elite=type==="elite";
  return {x,y:GROUND-(elite?70:52),w:elite?42:32,h:elite?70:52,vx:0,vy:0,face:-1,type,hp:elite?100:48,maxHp:elite?100:48,speed:elite?55:78,range:elite?72:54,state:"patrol",timer:rand(.5,1.5),attackCd:rand(.5,1.4),stun:0,flash:0,attack:null,hitThisAttack:false,alive:true,home:x,patrolDir:1,anim:0};
}
function makeBoss(){return {x:3100,y:GROUND-112,w:70,h:112,vx:0,vy:0,face:-1,hp:300,maxHp:300,phase:1,state:"intro",timer:1.5,attack:null,attackCd:1.2,stun:0,flash:0,alive:true,anim:0,hitThisAttack:false,phaseText:false};}
function resetGame(){player=makePlayer();enemies=[];boss=null;particles=[];camera={x:0};shake=0;gameTime=0;kills=0;damageFlash=0;}
function solidPlatforms(){return [{x:0,y:GROUND,w:WORLD,h:H-GROUND+100},...platforms];}
function spawnParticles(x,y,color,count=8,power=130){
  for(let i=0;i<count;i++){const a=rand(0,Math.PI*2),s=rand(power*.25,power);particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(.18,.55),maxLife:.55,size:rand(2,5),color,gravity:250});}
}
function updateParticles(dt){for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.gravity*dt;p.vx*=Math.pow(.04,dt);}particles=particles.filter(p=>p.life>0);}
function physics(entity,dt){
  entity.x=clamp(entity.x+entity.vx*dt,0,WORLD-entity.w);const oldBottom=entity.y+entity.h;entity.vy+=1500*dt;entity.y+=entity.vy*dt;entity.grounded=false;
  for(const p of solidPlatforms()){if(entity.vy>=0&&oldBottom<=p.y+3&&entity.y+entity.h>=p.y&&entity.x+entity.w>p.x&&entity.x<p.x+p.w){entity.y=p.y-entity.h;entity.vy=0;entity.grounded=true;}}
  if(entity.y>H+250){entity.y=GROUND-entity.h;entity.vy=0;}
}
function attackBox(entity,range,height){const x=entity.face===1?entity.x+entity.w:entity.x-range;return {x,y:entity.y+(entity.h-height)*.48,w:range,h:height};}
function startAttack(kind){if(mode!=="playing"||player.stun>0||player.dodge>0||player.attack)return;player.attack={kind,phase:"windup",timer:kind==="light"?.1:.32,active:kind==="light"?.13:.19,recovery:kind==="light"?.22:.48,hit:new Set(),serial:++player.attackSerial};player.state="attack";sound(kind==="light"?270:130,kind==="light"?.08:.17);}
function startParry(){if(player.parryCd>0||player.stun>0||player.dodge>0||player.attack)return;player.parry=.19;player.parryCd=.65;player.state="parry";sound(420,.045,"triangle",.02);}
function startDodge(){if(player.dodgeCd>0||player.dodge>0||player.stun>0)return;player.dodge=.24;player.dodgeCd=.78;player.invuln=.29;player.vx=player.face*490;player.state="dodge";player.attack=null;spawnParticles(player.x+player.w/2,player.y+player.h/2,"#9cabb4",5,70);sound(100,.08,"triangle",.025);}
function hurtPlayer(dmg,fromX){if(player.invuln>0||player.dodge>0||mode!=="playing")return;player.hp=Math.max(0,player.hp-dmg);player.invuln=.62;player.stun=.18;player.attack=null;player.vx=(player.x+player.w/2<fromX?-1:1)*175;spawnParticles(player.x+player.w/2,player.y+player.h/2,"#b94e4e",12,150);damageFlash=.12;shake=5;sound(85,.13);if(player.hp<=0)defeat();}

  let state = freshState();
  let current = REGIONS.dark_castle;
  let nearestHint = "";

  function safeStorageGet() {
    try { return localStorage.getItem(SAVE_KEY); } catch (_) { return null; }
  }
  function safeStorageSet(value) {
    try { localStorage.setItem(SAVE_KEY, value); return true; } catch (_) { return false; }
  }
  function progressFor(zoneId) {
    if (!state.regionProgress[zoneId]) state.regionProgress[zoneId] = makeRegionProgress();
    return state.regionProgress[zoneId];
  }
  function hasAbility(id) { return Boolean(state.abilities[id]); }
  function owned(slot, id) { return state.inventory[slot].includes(id); }
  function currentItem(slot) {
    const id = state.equipment[slot];
    return (ITEMS[slot === "weapon" ? "weapons" : slot === "armor" ? "armor" : "rings"][id]) || null;
  }
  function flag(name, value = true) { state.flags[name] = value; }
  function setMode(name) { mode = name; }
  function showModal(modeName, title, body, buttons) {
    setMode(modeName);
    showPanel(title, body, buttons);
  }
  function closeModal() { setMode("playing"); hidePanel(); }
  function syncDerivedStats() {
    if (!player) return;
    player.stats = player.stats || { strength: BASE.strength, dexterity: BASE.dexterity, vigor: BASE.vigor };
    player.stats.strength = Math.max(1, Number(player.stats.strength) || BASE.strength);
    player.stats.dexterity = Math.max(1, Number(player.stats.dexterity) || BASE.dexterity);
    player.stats.vigor = Math.max(1, Number(player.stats.vigor) || BASE.vigor);
    player.level = Math.max(1, Number(player.level) || 1);
    player.ashes = Math.max(0, Number(player.ashes) || 0);
    player.maxHp = BASE.hp + (player.stats.vigor - BASE.vigor) * 12;
    player.maxStamina = BASE.stamina + (player.stats.dexterity - BASE.dexterity) * 5;
    player.hp = clamp(Number(player.hp ?? player.maxHp), 0, player.maxHp);
    player.stamina = clamp(Number(player.stamina ?? player.maxStamina), 0, player.maxStamina);
    player.exhaustedTimer = Math.max(0, player.exhaustedTimer || 0);
    player.staminaRegenDelay = Math.max(0, player.staminaRegenDelay || 0);
    player.shadowDashTimer = Math.max(0, player.shadowDashTimer || 0);
    player.jumpCount = Math.max(0, player.jumpCount || 0);
    player.wallSide = player.wallSide || 0;
    player.wallJumpTimer = Math.max(0, player.wallJumpTimer || 0);
    player.wallJumpDir = player.wallJumpDir || 0;
  }
  function findRegionInteractables() {
    const items = [];
    current.fires.forEach(x => items.push({ ...x, kind: "fire", y: GROUND - 20 }));
    current.npcs.forEach(x => items.push({ ...x, kind: "npc", y: GROUND - 35 }));
    current.lore.forEach(x => items.push({ ...x, kind: "lore", y: GROUND - 20 }));
    current.shrines.forEach(x => items.push({ ...x, kind: "shrine", y: GROUND - 30 }));
    return items;
  }
  function nearestInteractable(maxDistance = 120) {
    if (!player) return null;
    const px = player.x + player.w / 2;
    let best = null, bestDist = maxDistance;
    for (const item of findRegionInteractables()) {
      const d = Math.abs(px - item.x);
      if (d < bestDist) { best = { ...item, distance: d }; bestDist = d; }
    }
    const spot = state.deathSpot;
    if (spot && spot.zone === state.currentZone) {
      const d = Math.abs(px - spot.x);
      if (d < Math.min(74, maxDistance) && d < bestDist) { best = { kind: "deathSpot", x: spot.x, y: spot.y, distance: d }; bestDist = d; }
    }
    return best;
  }
  function lockedReason(requirement) {
    if (!requirement) return "";
    const names = { doubleJump: "Çift Zıplama", wallJump: "Duvar Sıçrayışı", shadowDash: "Gölge Kaçınması" };
    return `Bu mühür ${names[requirement] || requirement} yeteneği olmadan açılmıyor.`;
  }

  function loadZone(zoneId, spawnX, options = {}) {
    if (!REGIONS[zoneId]) return false;
    current = REGIONS[zoneId];
    state.currentZone = zoneId;
    if (!state.visitedZones.includes(zoneId)) state.visitedZones.push(zoneId);
    WORLD = current.width;
    platforms.splice(0, platforms.length, ...current.platforms.map(p => ({ ...p })));

    enemies = current.enemies
      .filter(def => !progressFor(zoneId).defeated.includes(def.id))
      .map(def => {
        const enemy = makeEnemy(def.x, def.type);
        enemy.id = def.id;
        enemy.ashReward = def.ashes;
        enemy.x = def.x;
        enemy.home = def.x;
        return enemy;
      });

    boss = null;
    if (current.boss && !progressFor(zoneId).bossDefeated) {
      boss = makeBoss();
      boss.x = current.boss.x;
      boss.y = GROUND - boss.h;
      const bp = progressFor(zoneId);
      if (Number.isFinite(bp.bossHp)) boss.hp = clamp(bp.bossHp, 1, boss.maxHp);
      boss.phase = bp.bossPhase || 1;
    }
    bossUnlocked = !boss || enemies.every(e => !e.alive);
    bossNotice = false;
    if (player) {
      player.x = clamp(Number(spawnX ?? current.spawnX), 0, WORLD - player.w);
      player.y = GROUND - player.h;
      player.vx = 0; player.vy = 0; player.grounded = false;
      player.attack = null; player.dodge = 0; player.parry = 0;
      player.shadowDashTimer = 0; player.jumpCount = 0; player.wallSide = 0;
    }
    camera = { x: player ? clamp(player.x + player.w / 2 - W / 2, 0, Math.max(0, WORLD - W)) : 0 };
    if (!options.quiet) bannerText(current.name.toLocaleUpperCase("tr-TR"), 2.3);
    return true;
  }

  function newGame() {
    if (typeof bossCinematicPlayed !== "undefined") bossCinematicPlayed.clear();
    if (typeof bossCinematicTimer !== "undefined") bossCinematicTimer = 0;
    state = freshState();
    player = makePlayer();
    player.stamina = BASE.stamina;
    player.ashes = 0;
    player.level = 1;
    player.stats = { strength: BASE.strength, dexterity: BASE.dexterity, vigor: BASE.vigor };
    player.staminaRegenDelay = 0;
    player.exhaustedTimer = 0;
    player.shadowDashTimer = 0;
    player.jumpCount = 0;
    player.wallSide = 0;
    enemies = [];
    boss = null;
    particles = [];
    camera = { x: 0 };
    shake = 0; gameTime = 0; kills = 0; damageFlash = 0;
    syncDerivedStats();
    loadZone("dark_castle", 105, { quiet: true });
    state.checkpoint = { zone: "dark_castle", x: 145 };
    banner = "KARANLIK KALE"; bannerTimer = 2.5;
  }

  function saveGame() {
    syncDerivedStats();
    const payload = {
      state,
      player: {
        hp: player.hp, stamina: player.stamina, ashes: player.ashes,
        level: player.level, stats: { ...player.stats },
        face: player.face
      }
    };
    return safeStorageSet(JSON.stringify(payload));
  }
  function hasSave() { return Boolean(safeStorageGet()); }
  function continueGame() {
    const raw = safeStorageGet();
    if (!raw) { startGame(); return; }
    try {
      const data = JSON.parse(raw);
      state = Object.assign(freshState(), data.state || {});
      state.regionProgress = Object.assign(freshState().regionProgress, state.regionProgress || {});
      state.flags = Object.assign(freshState().flags, state.flags || {});
      state.abilities = Object.assign(freshState().abilities, state.abilities || {});
      state.inventory = Object.assign(freshState().inventory, state.inventory || {});
      for (const slot of ["weapons", "armor", "rings", "skins"]) if (!Array.isArray(state.inventory[slot])) state.inventory[slot] = [];
      state.equipment = Object.assign(freshState().equipment, state.equipment || {});
      player = makePlayer();
      Object.assign(player, data.player || {});
      player.stats = Object.assign({ ...BASE }, data.player?.stats || {});
      syncDerivedStats();
      const cp = state.checkpoint || { zone: "dark_castle", x: 145 };
      loadZone(REGIONS[cp.zone] ? cp.zone : "dark_castle", cp.x, { quiet: true });
      player.hp = player.maxHp;
      player.stamina = player.maxStamina;
      mode = "controls";
      showPanel("YOLCULUK SÜRÜYOR", `<p>${current.name} bölgesindeki son dinlenme noktasına döndün.</p><p class="small">Seviye ${player.level} · ${player.ashes} Kül · Kayıt yüklendi.</p>`, [
        { label: "YOLCULUĞA DEVAM ET", action: () => { mode = "playing"; hidePanel(); bannerText("KÜLLERİN İZİ", 2); } },
        { label: "ANA MENÜ", action: mainMenu }
      ]);
    } catch (err) {
      console.warn("Kayıt okunamadı:", err);
      state = freshState();
      startGame();
    }
  }

  function updatePlayerTimers(dt) {
    if (!player) return;
    player.shadowDashTimer = Math.max(0, (player.shadowDashTimer || 0) - dt);
    player.exhaustedTimer = Math.max(0, (player.exhaustedTimer || 0) - dt);
    player.staminaRegenDelay = Math.max(0, (player.staminaRegenDelay || 0) - dt);
    if (player.staminaRegenDelay <= 0 && player.attack === null && player.dodge <= 0 && player.parry <= 0 && player.shadowDashTimer <= 0 && player.stun <= 0) {
      const ring = ITEMS.rings[state.equipment.ring] || ITEMS.rings.none;
      const regen = 23 + (player.stats.dexterity - BASE.dexterity) * 1.2 + ring.regen;
      player.stamina = Math.min(player.maxStamina, player.stamina + regen * dt);
    }
  }
  function spendStamina(amount) {
    if (!player || player.exhaustedTimer > 0) return false;
    if (player.stamina < amount) {
      player.stamina = 0;
      player.exhaustedTimer = 1.05;
      player.stun = Math.max(player.stun || 0, 0.38);
      player.staminaRegenDelay = 1.0;
      bannerText("DAYANIKLILIK TÜKENDİ", 1.15);
      sound(70, 0.12, "triangle", 0.035);
      return false;
    }
    player.stamina -= amount;
    player.staminaRegenDelay = 0.78;
    if (player.stamina <= 0.001) {
      player.stamina = 0;
      player.exhaustedTimer = 0.8;
      player.stun = Math.max(player.stun || 0, 0.28);
      return false;
    }
    return true;
  }
  function attackCost(kind) {
    const weapon = ITEMS.weapons[state.equipment.weapon] || ITEMS.weapons.wornSword;
    return Math.max(8, (kind === "light" ? 16 : 30) + weapon.stamina);
  }
  function attackRange(kind) {
    const weapon = ITEMS.weapons[state.equipment.weapon] || ITEMS.weapons.wornSword;
    return Math.max(42, (kind === "light" ? 63 : 82) + weapon.reach);
  }
  function attackDamage(kind) {
    const weapon = ITEMS.weapons[state.equipment.weapon] || ITEMS.weapons.wornSword;
    const strength = player.stats.strength - BASE.strength;
    const dex = player.stats.dexterity - BASE.dexterity;
    return Math.max(1, Math.floor((kind === "light" ? 22 : 39) + strength * (kind === "light" ? 1.5 : 2.0) + (kind === "light" ? dex * 0.6 : 0) + weapon.damage));
  }
  function bossDamage(kind) {
    const weapon = ITEMS.weapons[state.equipment.weapon] || ITEMS.weapons.wornSword;
    return Math.max(1, Math.floor((kind === "light" ? 14 : 28) + (player.stats.strength - BASE.strength) * 1.2 + weapon.damage * 0.45));
  }
  function defenseValue() {
    const armor = ITEMS.armor[state.equipment.armor] || ITEMS.armor.tattered;
    const ring = ITEMS.rings[state.equipment.ring] || ITEMS.rings.none;
    return armor.defense + ring.defense;
  }

  function onEnemyKilled(enemy) {
    const rp = progressFor(state.currentZone);
    if (enemy.id && !rp.defeated.includes(enemy.id)) rp.defeated.push(enemy.id);
    player.ashes += Math.max(0, enemy.ashReward || (enemy.type === "elite" ? 50 : 20));
    if (enemy.type !== "elite") state.counters.soldiersDefeated++;
    if (!state.flags.lostWatchDone && state.flags.lostWatchQuest && state.counters.soldiersDefeated >= 3) {
      state.flags.lostWatchDone = true;
      player.ashes += 90;
      bannerText("YAN GÖREV TAMAMLANDI · KAYIP NÖBETÇİLER", 2.6);
    }
  }
  function onBossKilled() {
    if (!current.boss) return;
    const rp = progressFor(state.currentZone);
    rp.bossDefeated = true; rp.bossHp = 0;
    state.flags.bossDefeated = true;
    player.ashes += 350;
    if (!owned("weapons", "voidreaver")) {
      state.inventory.weapons.push("voidreaver");
      bannerText("KRALIN MİRASI · EFSANEVİ BOŞLUKYARAN KAZANILDI", 3.2);
    } else bannerText("ANA GÖREV TAMAMLANDI · KIRIK TAÇ", 3);
    saveGame();
  }
  function persistBoss() {
    if (boss && current.boss && boss.alive) {
      const rp = progressFor(state.currentZone);
      rp.bossHp = boss.hp;
      rp.bossPhase = boss.phase;
    }
  }
  function dropAshesOnDeath() {
    if (state.deathSpot && player.ashes <= 0) {
      // Dying again before retrieval permanently erases the previous pile.
      state.deathSpot = null;
    } else if (player.ashes > 0) {
      state.deathSpot = { zone: state.currentZone, x: player.x + player.w / 2, y: player.y + player.h / 2, ashes: player.ashes };
    }
    player.ashes = 0;
    player.attack = null; player.vx = 0; player.vy = 0;
    saveGame(); // Kül yığını ve öldürdüğün düşmanlar yeniden yüklemede kaybolmasın.
    mode = "dead";
    const lost = state.deathSpot && state.deathSpot.zone === state.currentZone ? state.deathSpot.ashes : 0;
    showPanel("KÜLLERİN İÇİNDE", `<p>Son savaşçı yere düştü. Karanlık kale seni son lütfunun yakınında bekliyor.</p><p>${lost > 0 ? `${lost} Kül düştüğün yerde kaldı.` : "Taşların üzerinde geri alınacak kül kalmadı."}</p><p class="small">Düşmeden önceki düşman ilerlemen korunur. Dinlenme noktasında yeniden doğacaksın.</p>`, [
      { label: "SON LÜTFUNDA UYAN", action: respawnAtCheckpoint },
      { label: "ANA MENÜ", action: mainMenu }
    ]);
  }
  function respawnAtCheckpoint() {
    const cp = state.checkpoint || { zone: "dark_castle", x: 145 };
    loadZone(cp.zone, cp.x, { quiet: true });
    player.hp = player.maxHp; player.stamina = player.maxStamina;
    player.invuln = 1.0; player.stun = 0; player.exhaustedTimer = 0;
    mode = "playing"; hidePanel(); bannerText("YENİDEN AYAĞA KALK", 1.8);
  }

  function openRestMenu(fire) {
    showModal("rest", "DİNLENME NOKTASI", `<p><strong>${fire.name}</strong></p><p>Canın ve dayanıklılığın dolar. Harita ve ilerlemen kaydedilir. Normal düşmanlar yeniden doğar.</p><p>Kül: <strong>${player.ashes}</strong> · Seviye: ${player.level}</p>`, [
      { label: "DİNLEN VE KAYDET", action: () => restAt(fire) },
      { label: "SEVİYE ATLA", action: openLevelMenu },
      { label: "ENVANTER", action: openInventory },
      { label: "GÖREVLER", action: openQuestLog },
      { label: "DEVAM ET", action: closeModal }
    ]);

  function restAt(fire) {
    player.hp = player.maxHp; player.stamina = player.maxStamina;
    player.stun = 0; player.exhaustedTimer = 0; player.invuln = 0.5;
    for (const zoneId of Object.keys(REGIONS)) progressFor(zoneId).defeated = [];
    state.checkpoint = { zone: state.currentZone, x: fire.x };
    loadZone(state.currentZone, fire.x, { quiet: true });
    player.hp = player.maxHp; player.stamina = player.maxStamina;
    const saved = saveGame();
    mode = "playing"; hidePanel();
    bannerText(saved ? "LÜTUF KAYDEDİLDİ · DÜŞMANLAR GERİ DÖNDÜ" : "LÜTUF YENİLENDİ · KAYIT KULLANILAMIYOR", 2.8);
  }

  function levelCost() { return Math.floor(90 + Math.pow(player.level, 1.45) * 48); }
  function levelStat(stat) {
    const cost = levelCost();
    if (player.ashes < cost) { bannerText("YETERLİ KÜL YOK", 1.2); openLevelMenu(); return; }
    player.ashes -= cost;
    player.level++;
    player.stats[stat]++;
    const oldHp = player.hp, oldStamina = player.stamina;
    syncDerivedStats();
    if (stat === "vigor") player.hp = Math.min(player.maxHp, oldHp + 12);
    else player.hp = Math.min(player.maxHp, oldHp);
    if (stat === "dexterity") player.stamina = Math.min(player.maxStamina, oldStamina + 5);
    else player.stamina = Math.min(player.maxStamina, oldStamina);
    bannerText("SEVİYE YÜKSELDİ", 1.4);
    openLevelMenu();
  }
  function openLevelMenu() {
    const cost = levelCost();
    showModal("levelup", "KÜLLE GÜÇLEN", `<p>Kül: <strong>${player.ashes}</strong> · Sonraki seviye maliyeti: <strong>${cost}</strong></p><p>Seviye ${player.level} · Güç ${player.stats.strength} · Çeviklik ${player.stats.dexterity} · Bünye ${player.stats.vigor}</p><p class="small">Güç saldırı hasarını, çeviklik dayanıklılığı ve yenilenmeyi, bünye azami canı artırır.</p>`, [
      { label: `GÜÇ +1 (${cost} Kül)`, action: () => levelStat("strength") },
      { label: `ÇEVİKLİK +1 (${cost} Kül)`, action: () => levelStat("dexterity") },
      { label: `BÜNYE +1 (${cost} Kül)`, action: () => levelStat("vigor") },
      { label: "DİNLENME MENÜSÜ", action: () => openRestMenu({ name: "Dinlenme Noktası", x: player.x }) }
    ]);
  }

  function equip(slot, id) {
    const bucket = slot === "weapon" ? "weapons" : slot === "armor" ? "armor" : slot === "skin" ? "skins" : "rings";
    if (slot === "skin" && id === "default") { state.equipment.skin = "default"; bannerText("YIPRANMIŞ ÇELİK KUŞANILDI", 1.2); openInventory(); return; }
    if (!owned(bucket, id) && !(slot === "ring" && id === "none")) return;
    state.equipment[slot] = id;
    bannerText(`${ITEMS[bucket][id].name.toLocaleUpperCase("tr-TR")} KUŞANILDI`, 1.2);

  function checkDoors() {
    for (const door of current.doors) {
      const d = { x: door.x, y: door.y, w: door.w, h: door.h };
      if (!rects(player, d)) continue;
      if (door.requires && !hasAbility(door.requires)) {
        if (door.fromRight) player.x = door.x + door.w + 1;
        else player.x = door.x - player.w - 1;
        player.vx = 0;
        if (nearestHint !== door.id) bannerText(lockedReason(door.requires), 1.65);
        nearestHint = door.id;
        return;
      }
      nearestHint = "";
      loadZone(door.to, door.toX);
      return;
    }
    nearestHint = "";
  }

  function resolveHorizontalCollision(entity, oldX) {
    if (!current || !entity) return;
    if (entity === player) entity.wallSide = 0;
    const obstacles = [
      ...(current.walls || []).map(o => ({ ...o, kind: "wall" })),
      ...(current.gates || []).map(o => ({ ...o, kind: "gate" })),
      ...(current.doors || []).filter(d => d.requires && !hasAbility(d.requires)).map(d => ({
        ...d, y: GROUND - 220, h: 220, kind: "lockedDoor"
      }))
    ];
    for (const obstacle of obstacles) {
      if (entity.x + entity.w <= obstacle.x || entity.x >= obstacle.x + obstacle.w ||
          entity.y + entity.h <= obstacle.y || entity.y >= obstacle.y + obstacle.h) continue;
      let canPass = false;
      if (entity === player && obstacle.kind === "gate") {
        if (obstacle.requires === "shadowDash") canPass = hasAbility("shadowDash") && player.shadowDashTimer > 0;
        else if (obstacle.requires) canPass = hasAbility(obstacle.requires);
      }
      if (canPass) continue;
      if (entity === player && obstacle.kind === "lockedDoor" && bannerTimer <= 0) {
        bannerText(lockedReason(obstacle.requires), 1.65);
      }
      if (oldX + entity.w <= obstacle.x + 4) {
        entity.x = obstacle.x - entity.w;
        if (entity === player) entity.wallSide = 1;
      } else if (oldX >= obstacle.x + obstacle.w - 4) {
        entity.x = obstacle.x + obstacle.w;
        if (entity === player) entity.wallSide = -1;
      } else {
        entity.x = oldX;
      }
      entity.vx = 0;
    }
  }
  function tryWallJump() {
    if (!player || player.grounded || player.stun > 0 || !hasAbility("wallJump") || !player.wallSide) return false;
    const jumpDir = -player.wallSide;
    player.vy = -570;
    player.vx = jumpDir * 315;
    player.face = jumpDir;
    player.grounded = false;
    player.wallSide = 0;
    player.wallJumpDir = jumpDir;
    player.wallJumpTimer = .17;
    player.jumpCount = 1;
    player.state = "jump";
    sound(235, .075, "triangle", .028);
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#aab5c9", 7, 95);
    return true;
  }
  function shadowDash() {
    if (!hasAbility("shadowDash")) { bannerText("GÖLGE KAÇINMASI HENÜZ AÇILMADI", 1.5); return; }
    if (player.dodgeCd > 0 || player.dodge > 0 || player.stun > 0 || player.attack || !spendStamina(28)) return;
    player.shadowDashTimer = .26;
    player.dodge = .26;
    player.dodgeCd = .82;
    player.invuln = .29;
    player.vx = player.face * 490;
    player.attack = null;
    player.state = "dodge";
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#6c7db7", 12, 125);
    sound(125, .1, "triangle", .03);
  }
  function updateWorld() {
    if (mode !== "playing" || !player) return;
    if (boss && boss.alive && enemies.every(e => !e.alive) && !bossUnlocked) {
      bossUnlocked = true; boss.state = "intro"; boss.timer = 0.85;
      bannerText("MÜHÜR KIRILDI · İÇİ BOŞ KRAL UYANIYOR", 3.2); shake = Math.max(shake, 7);
    }
    checkDoors();
    persistBoss();
  }

  function renderScene(context) {
    if (!current || !player) return;
    const cam = camera ? camera.x : 0;
    context.save();
    // Vertical gates and doors are visual landmarks; physics is resolved separately.
    for (const gate of current.gates || []) {
      const x = gate.x - cam;
      if (x < -80 || x > W + 80) continue;
      const gateReady = gate.requires === "shadowDash"
        ? hasAbility("shadowDash") && player.shadowDashTimer > 0
        : hasAbility(gate.requires);
      context.fillStyle = gateReady ? "#253c39" : "#351923";
      context.fillRect(x, gate.y, gate.w, gate.h);
      context.strokeStyle = gateReady ? "#79b29a" : "#b24b5c";
      context.lineWidth = 2; context.strokeRect(x - 4, gate.y, gate.w + 8, gate.h);
      context.fillStyle = "#e0cba8"; context.font = "10px Arial";
      context.fillText(gate.label || "MÜHÜR", x - 21, gate.y - 8);
    }
    for (const door of current.doors) {
      const x = door.x - cam;
      if (x < -100 || x > W + 100) continue;
      const open = !door.requires || hasAbility(door.requires);
      context.fillStyle = open ? "#6b5b43" : "#39202b";
      context.fillRect(x, door.y, door.w, door.h);
      context.strokeStyle = open ? "#c5a56f" : "#9e4453";

// Pointer controls are real hold/tap controls, not decorative mobile buttons.
function performTouchAction(action) {
  if (mode !== "playing") return;
  if (window.BladeRPG && window.BladeRPG.bossCinematicActive) return;
  if (action === "light") startAttack("light");
  else if (action === "heavy") startAttack("heavy");
  else if (action === "parry") startParry();
  else if (action === "dodge") startDodge();
  else if (action === "interact") interact();
  else if (action === "inventory") window.BladeRPG.openInventory();
  else if (action === "journal") window.BladeRPG.openQuestLog();
  else if (action === "map") window.BladeRPG.openMap();
  else if (action === "shadow") shadowDash();
  else if (action === "shop") window.BladeRPG.openShop();
  else if (action === "jump") {
    if (!player || player.stun > 0 || player.dodge > 0 || player.exhaustedTimer > 0) return;
    if (player.grounded) { player.vy=-570; player.grounded=false; player.state="jump"; player.jumpCount=1; sound(190,.08,"triangle",.025); }
    else if (tryWallJump()) return;
    else if (window.BladeRPG.hasAbility("doubleJump") && player.jumpCount < 2) { player.vy=-535; player.jumpCount=2; player.state="jump"; spawnParticles(player.x+player.w/2,player.y+player.h,"#d2dce5",8,100); sound(260,.075,"triangle",.025); }
  }
}
if (quickShopButton) quickShopButton.addEventListener("click", () => { if (mode === "playing") window.BladeRPG.openShop(); });
if (touchControls) {
  const releaseTouchControl = button => { const hold=button.dataset.hold; if (hold) keys.delete(hold); button.classList.remove("held"); };
  touchControls.querySelectorAll("button").forEach(button => {
    button.addEventListener("contextmenu", e => e.preventDefault());
    button.addEventListener("pointerdown", e => {
      e.preventDefault();
      if (mode !== "playing") return;
      try { button.setPointerCapture(e.pointerId); } catch (_) {}
      const hold=button.dataset.hold;
      if (hold) { keys.add(hold); button.classList.add("held"); }
      else performTouchAction(button.dataset.action);
    });
    for (const ev of ["pointerup","pointercancel","lostpointercapture","pointerleave"]) button.addEventListener(ev, () => releaseTouchControl(button));
  });
}
window.addEventListener("blur", () => { keys.clear(); if (touchControls) touchControls.querySelectorAll("button").forEach(b=>b.classList.remove("held")); });
setTouchMode(touchModeEnabled);
syncPlayControls();

const bladeTouchBaseAction = performTouchAction;

let bladePendingTarget = null;

function bladeCancelAutoInteract(){
  bladePendingInteraction = false; bladePendingTarget = null; keys.delete("a"); keys.delete("d");
}
performTouchAction = function(action){
  if(action === "interact"){
    if(mode !== "playing" || !player || !window.BladeRPG) return;
    if(window.BladeRPG.bossCinematicActive){ bannerText("KRALIN GİRİŞİ BİTENE KADAR BEKLE",1); return; }
    const target = window.BladeRPG.nearestInteractable ? window.BladeRPG.nearestInteractable(285) : null;
    if(target){
      const dx = target.x - (player.x + player.w/2);
      if(Math.abs(dx) > 78){
        bladePendingInteraction = true; bladePendingTarget = target.id || target.kind;
        keys.delete("a"); keys.delete("d"); keys.add(dx < 0 ? "a" : "d");

        return;

  }

};

  const target = window.BladeRPG && window.BladeRPG.nearestInteractable ? window.BladeRPG.nearestInteractable(315) : null;

  const dx = target.x - (player.x + player.w/2);

  }
};

  ctx.save();

  const halo=ctx.createRadialGradient(moonX,moonY,10,moonX,moonY,180);halo.addColorStop(0,"#d6c8ac24");halo.addColorStop(.42,"#9d9cb21a");halo.addColorStop(1,"#8b91af00");ctx.fillStyle=halo;ctx.fillRect(moonX-180,moonY-180,360,360);
  ctx.globalAlpha=.12;ctx.strokeStyle="#a8a5b9";ctx.lineWidth=1;
  for(let i=0;i<9;i++){const xx=moonX-110+i*27;ctx.beginPath();ctx.moveTo(xx,145);ctx.lineTo(xx-65,390);ctx.stroke();}
  ctx.globalAlpha=1;
  for(let i=0;i<42;i++){
    const x=((i*173+Math.sin(gameTime*.7+i)*28-camera.x*(.13+(i%5)*.025))%(W+40)+W+40)%(W+40)-20;
    const y=((i*71+gameTime*(7+(i%4)*4))%(H+30));
    const r=.65+(i%3)*.45;ctx.globalAlpha=.14+(i%5)*.055;ctx.fillStyle=i%4===0?"#b9c8e4":"#dbb47e";ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.restore();
};
const bladeDrawGroundBase = drawGround;
drawGround = function(){
  bladeDrawGroundBase();
  ctx.save();
  const floor=ctx.createLinearGradient(0,GROUND,0,H);floor.addColorStop(0,"#56505a14");floor.addColorStop(1,"#00000055");ctx.fillStyle=floor;ctx.fillRect(0,GROUND,W,H-GROUND);
  for(let i=0;i<28;i++){
    const x=((i*89-camera.x*.9)%(W+100)+W+100)%(W+100)-50;const y=GROUND+12+(i*19)%57;
    ctx.globalAlpha=.12+(i%3)*.03;ctx.fillStyle=i%3===0?"#bd9f74":"#95858d";ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+12+(i%5)*3,y-1);ctx.lineTo(x+8,y+2);ctx.closePath();ctx.fill();
  }
  ctx.globalAlpha=1;ctx.restore();
};

// Cinematic-grade edge light and restrained grain are kept out of the letterboxed intro.
const bladeRenderBase = render;
render = function(){
  bladeRenderBase();
  if(window.BladeRPG && window.BladeRPG.bossCinematicActive) return;
  ctx.save();
  const v=ctx.createRadialGradient(W/2,H*.48,H*.24,W/2,H*.48,H*.78);v.addColorStop(0,"#00000000");v.addColorStop(.73,"#02030a14");v.addColorStop(1,"#0202079c");ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
  // Fine horizontal atmospheric streaks, almost invisible until the scene moves.
  ctx.globalAlpha=.075;ctx.strokeStyle="#d4c9ad";ctx.lineWidth=1;
  for(let i=0;i<10;i++){const yy=(i*67+gameTime*9)%(H-100);ctx.beginPath();ctx.moveTo(0,yy);ctx.lineTo(W,yy-4);ctx.stroke();}
  ctx.restore();
};

requestAnimationFrame(loop);
